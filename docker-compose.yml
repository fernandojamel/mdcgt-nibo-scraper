services:
  nibo-scraper:
    build: .
    image: mdcgt/nibo-scraper:1.0.0
    container_name: nibo-scraper
    restart: unless-stopped
    env_file: .env
    ports:
      # Exposto apenas na rede interna do Docker — o n8n chama via nome do serviço.
      # Se rodar em host separado do n8n, exponha "3000:3000" e adicione firewall.
      - "127.0.0.1:3030:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Memória: Chromium é pesado. 1G é seguro.
    deploy:
      resources:
        limits:
          memory: 1G
